name: Continuous Integration (CI)

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devpulse_admin
          POSTGRES_PASSWORD: devpulse_password123
          POSTGRES_DB: business_os_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://devpulse_admin:devpulse_password123@localhost:5432/business_os_dev

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Turborepo Build
        run: pnpm turbo run build

      - name: Apply Database Migrations
        run: pnpm --filter @suite/db run db:migrate:deploy

      - name: Turborepo Lint
        run: pnpm turbo run lint

      - name: Turborepo Typecheck
        run: pnpm turbo run typecheck

      - name: Turborepo Test
        run: pnpm turbo run test
