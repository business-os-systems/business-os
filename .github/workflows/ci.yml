name: Continuous Integration (CI)

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]
  # The heavy evidence gates (diff coverage, a11y/perf) run nightly and on
  # demand; the PR gate stays deterministic and blocking on functional checks.
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Shared by every job. The test job additionally starts PostgreSQL and Redis.
env:
  DATABASE_URL: postgresql://businessos_admin:businessos_password@localhost:5432/business_os_dev
  # Owner identity. The Platform suites build fixtures with it and skip
  # themselves when it is absent, which would report green while running
  # no database test at all.
  DIRECT_URL: postgresql://businessos_admin:businessos_password@localhost:5432/business_os_dev
  PLATFORM_DATABASE_URL: postgresql://app_platform:platform_test_password@localhost:5432/business_os_dev
  TENANT_DATABASE_URL: postgresql://app_tenant:tenant_test_password@localhost:5432/business_os_dev
  CONTROL_SESSION_SECRET: platform-ci-session-secret-32-characters
  # Test-only key. Declared globally so config-loading tools (knip) and every
  # job can load the Playwright config without a local .env file.
  BETTER_AUTH_SECRET: release-gates-ci-session-secret-32-characters
  CONTROL_PLANE_ORIGIN: http://localhost:3002
  CONTROL_WEBAUTHN_RP_ID: localhost
  # The Platform support-session service reads this at startup; without it the
  # suite fails closed and every impersonation test errors.
  IMPERSONATION_MAX_MINUTES: "30"
  # The reference read cache consumes this pre-declared TTL at read time.
  CATALOG_CACHE_TTL_SECONDS: "60"
  REDIS_URL: redis://localhost:6379
  # Type-aware ESLint over the whole monorepo needs more than the 4 GB heap
  # once the tree grows; 8 GB stays inside a standard runner's memory.
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  # Independent of every other job: no build outputs are needed, so it runs
  # beside build and test instead of behind them.
  lint:
    name: Lint, rules & reports
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      # Same key as build/test so a repeated run reuses the package outputs.
      - name: Restore Turborepo Cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Type-aware ESLint resolves @suite/db types, which need the client.
      - name: Generate Prisma Client
        run: pnpm --filter @suite/db run prisma:generate

      # @suite/ui publishes types from dist, so type-aware ESLint degrades to
      # `any` without it and reports unsafe-access errors across the dashboard.
      # Building the workspace packages restores the precondition the old
      # single job had (it ran lint after a full build).
      - name: Build workspace packages for type-aware lint
        run: pnpm turbo run build --filter='./packages/**'

      - name: Lint (legacy violations are baselined; new ones fail)
        run: pnpm lint

      - name: Custom Lint Rule Tests
        run: pnpm test:rules

      - name: Diff Coverage Tool Tests
        run: node --test tooling/quality/diff-coverage.test.mjs

      # The budget document and its validator are release gates: a malformed
      # budget or an over-budget sample must fail before any browser runs.
      - name: Performance Budget Validator Tests
        run: node --test tooling/quality/perf-budgets.test.mjs

      - name: Performance Budget Tool Tests
        run: node --test tooling/quality/perf-budgets.test.mjs

      - name: Dead Code & Dependency Report
        run: pnpm knip:report

      - name: Architecture & Cycle Report
        run: pnpm depcruise:report

      - name: Duplication Report
        run: pnpm dup:report

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      # Restored before the first turbo invocation so every task can hit.
      - name: Restore Turborepo Cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # The Prisma client lives in node_modules, not in the Turbo cache.
      # Generate it before any build so a cache hit cannot skip it.
      - name: Generate Prisma Client
        run: pnpm --filter @suite/db run prisma:generate

      - name: Turborepo Build
        run: pnpm turbo run build

      - name: Report Turborepo Cache Size
        if: always()
        run: du -sh .turbo/cache || true

  test:
    name: Typecheck & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: businessos_admin
          POSTGRES_PASSWORD: businessos_password
          POSTGRES_DB: business_os_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Restore Turborepo Cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @suite/db run prisma:generate

      - name: Apply Database Migrations
        run: pnpm --filter @suite/db run db:migrate:deploy

      # Re-assert the corrected usage projection on every test database. The
      # migration is applied above, but this makes the media quota measurement
      # deterministic even if a database recorded an earlier view revision.
      - name: Ensure usage projection correction
        working-directory: packages/db
        run: >
          pnpm exec prisma db execute --url "$DATABASE_URL"
          --file prisma/schema/migrations/20261111190000_platform_usage_media_storage_fix/migration.sql

      - name: Provision Platform Runtime Role
        run: |
          printf "ALTER ROLE app_platform WITH LOGIN PASSWORD 'platform_test_password';" | pnpm --filter @suite/db exec prisma db execute --url "$DATABASE_URL" --stdin

      - name: Provision Tenant Runtime Role
        run: |
          printf "ALTER ROLE app_tenant WITH LOGIN PASSWORD 'tenant_test_password';" | pnpm --filter @suite/db exec prisma db execute --url "$DATABASE_URL" --stdin

      - name: Turborepo Typecheck & Test
        run: pnpm turbo run typecheck && pnpm turbo run test --concurrency=1

  # Pull-request only: every added source line must be exercised by the
  # Vitest suites. The database and Redis fixtures mirror the test job because
  # the suites connect when DATABASE_URL is present instead of skipping.
  diff-coverage:
    name: Diff Coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: businessos_admin
          POSTGRES_PASSWORD: businessos_password
          POSTGRES_DB: business_os_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          # The gate diffs against the pull request base, which needs history.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Restore Turborepo Cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @suite/db run prisma:generate

      - name: Apply Database Migrations
        run: pnpm --filter @suite/db run db:migrate:deploy

      # Re-assert the corrected usage projection on every test database. The
      # migration is applied above, but this makes the media quota measurement
      # deterministic even if a database recorded an earlier view revision.
      - name: Ensure usage projection correction
        working-directory: packages/db
        run: >
          pnpm exec prisma db execute --url "$DATABASE_URL"
          --file prisma/schema/migrations/20261111190000_platform_usage_media_storage_fix/migration.sql

      - name: Provision Platform Runtime Role
        run: |
          printf "ALTER ROLE app_platform WITH LOGIN PASSWORD 'platform_test_password';" | pnpm --filter @suite/db exec prisma db execute --url "$DATABASE_URL" --stdin

      - name: Provision Tenant Runtime Role
        run: |
          printf "ALTER ROLE app_tenant WITH LOGIN PASSWORD 'tenant_test_password';" | pnpm --filter @suite/db exec prisma db execute --url "$DATABASE_URL" --stdin

      # Writes <package>/coverage/lcov.info for every package with a test suite.
      - name: Coverage (lcov per package)
        run: pnpm test:coverage

      - name: Diff coverage gate
        env:
          # Passed through the environment so the ref is never interpolated
          # into the shell command line.
          BASE_REF: ${{ github.base_ref }}
        run: node tooling/quality/diff-coverage.mjs --base "origin/$BASE_REF"

  # H-02: the release gates that turn FR-063/FR-064 and SC-009 into a red
  # build. Both suites render the real storefront and workspace; only their
  # upstream data is replaced with deterministic fixtures, so the job needs no
  # release host, storage state or external network.
  release-gates:
    name: Release gates (a11y & performance)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: businessos_admin
          POSTGRES_PASSWORD: businessos_password
          POSTGRES_DB: business_os_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Test-only signing key for the deterministic tenant session cookie.
      BETTER_AUTH_SECRET: release-gates-ci-session-secret-32-characters
      DOMAIN_ROOT: localhost
      # The inquiries screen reads the tenant plane. This is the CI service
      # database, never a developer database.
      TENANT_DATABASE_URL: postgresql://app_tenant:tenant_test_password@localhost:5432/business_os_dev

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Restore Turborepo Cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @suite/db run prisma:generate

      - name: Apply Database Migrations
        run: pnpm --filter @suite/db run db:migrate:deploy

      # Re-assert the corrected usage projection on every test database. The
      # migration is applied above, but this makes the media quota measurement
      # deterministic even if a database recorded an earlier view revision.
      - name: Ensure usage projection correction
        working-directory: packages/db
        run: >
          pnpm exec prisma db execute --url "$DATABASE_URL"
          --file prisma/schema/migrations/20261111190000_platform_usage_media_storage_fix/migration.sql

      - name: Provision Tenant Runtime Role
        run: |
          printf "ALTER ROLE app_tenant WITH LOGIN PASSWORD 'tenant_test_password';" | pnpm --filter @suite/db exec prisma db execute --url "$DATABASE_URL" --stdin

      - name: Build Workspace Packages
        run: pnpm turbo run build --filter='./packages/**'

      - name: Install Playwright Chromium
        run: pnpm --filter @suite/web exec playwright install --with-deps chromium

      # Build once here so the Playwright webServer only starts the app; a
      # combined build+start command obscures the real startup error in CI.
      - name: Build storefront for release gates
        run: pnpm --filter @suite/web build

      - name: Accessibility Gate (axe WCAG 2.1 A/AA + keyboard paths)
        run: pnpm --filter @suite/web exec playwright test --project=accessibility

      - name: Performance Gate (Core Web Vitals + interaction p95)
        run: pnpm --filter @suite/web exec playwright test --project=performance

      - name: Validate Performance Budgets
        run: |
          node tooling/quality/validate-perf-budgets.mjs \
            --budgets tooling/quality/perf-budgets.json \
            --results apps/web/test-results/release-evidence/perf-results.json \
            --report apps/web/test-results/release-evidence/perf-report.json

      - name: Record Release Checklist Artifact
        if: always()
        run: |
          node tooling/quality/release-checklist.mjs \
            --a11y apps/web/test-results/release-evidence/a11y.json \
            --perf-report apps/web/test-results/release-evidence/perf-report.json \
            --output artifacts/release-gates/release-checklist.md \
            --commit "${{ github.sha }}"

      - name: Upload Release Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gates-evidence
          path: |
            apps/web/test-results/**
            artifacts/release-gates/**
          if-no-files-found: warn
  # Keeps the check name branch protection and reviewers already know. The real
  # signal is the jobs above; this one only reports their result, including the
  # release gate so a budget or axe breach cannot leave an aggregate green check.
  verify:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    needs: [lint, build, test, release-gates]

    steps:
      - name: All verification jobs passed
        run: echo "lint, build and typecheck/test completed successfully."
