name: Production Deployment

on:
  push:
    branches:
      - deploy-dev
  workflow_dispatch:

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build Containers & Deploy to VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase Repository Name
        run: |
          echo "IMAGE_PREFIX=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # The operator console build bakes its API origin, so a missing host must
      # fail here instead of producing a console that calls "https://".
      - name: Validate Deployment Secrets
        env:
          OPERATOR_HOST: ${{ secrets.OPERATOR_HOST }}
        run: |
          if [ -z "${OPERATOR_HOST}" ]; then
            echo "::error::OPERATOR_HOST repository secret must hold the operator console hostname"
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every image built here is named by a service in
      # deploy/platform/docker-compose.yml, so the deploy step pulls exactly the
      # images this job pushed and nothing is built without being used.
      - name: Build & Push Core API Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/business-os-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Tenant Dashboard Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/dashboard/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/business-os-dashboard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Public Storefront Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/business-os-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Operator Console Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/platform/Dockerfile
          target: platform
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/business-os-platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ secrets.OPERATOR_HOST }}

      # The deploy host runs the compose file, the Caddyfile and the deploy
      # scripts from its checkout, so the artifacts that define the edge are
      # copied before the stack is touched. The host's .env files are not in the
      # repository and are deliberately left in place.
      - name: Sync Deployment Artifacts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: developer
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "deploy/platform"
          target: "/home/developer/app"

      - name: Deploy to Webyne VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: developer
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /home/developer/app
            # The deployment env is the union of the app env and the deploy env;
            # source both so the edge scripts and compose interpolation read the
            # values the applications read.
            set -a
            . ./.env
            . ./deploy/platform/.env
            set +a
            # Fail before a single container starts: a missing host, origin,
            # database or storage value, or a missing wildcard certificate,
            # blocks the deploy with a named reason (N4).
            ./deploy/platform/preflight.sh || exit 1
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            # Pull only the services this workflow pushed; a missing service
            # name fails the deploy instead of silently skipping an application.
            docker compose pull api dashboard web platform
            docker compose run --rm api pnpm --filter @suite/db prisma migrate deploy
            docker compose run --rm api pnpm --filter @suite/db prisma migrate status
            docker compose run --rm api sh -c 'printf "SELECT 1;" | pnpm --filter @suite/db exec prisma db execute --url "$PLATFORM_DATABASE_URL" --stdin'
            docker compose up -d --remove-orphans
            # A container that cannot answer its own healthcheck is a failed
            # deploy, not a green one. Each wait is bounded to 150 seconds.
            for service in api dashboard web platform; do
              health="starting"
              for attempt in $(seq 1 30); do
                health=$(docker compose ps --format '{{.Health}}' "$service" | head -n 1)
                if [ "$health" = "healthy" ]; then
                  break
                fi
                sleep 5
              done
              if [ "$health" != "healthy" ]; then
                echo "::error::$service did not become healthy"
                docker compose logs --tail 50 "$service"
                exit 1
              fi
            done
            # Browser uploads are cross-origin PUTs: apply the bucket CORS policy
            # and read it back instead of leaving it as a runbook step (N9).
            ./deploy/platform/object-storage-cors.sh || exit 1
            # A stack that is healthy but does not serve a tenant host over TLS
            # is a failed deploy; prove /, /dashboard and /robots.txt (N3).
            ./deploy/platform/smoke-tenant-host.sh || exit 1
            docker image prune -f
