name: Production Deployment

on:
  push:
    branches:
      - deploy-dev
  workflow_dispatch:

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build Containers & Deploy to VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase Repository Name
        run: |
          echo "IMAGE_PREFIX=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Core API Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/business-os-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Dashboard Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/dashboard/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/business-os-dashboard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Webyne VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: developer
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /home/developer/app
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose pull api dashboard
            docker compose up -d --remove-orphans
            docker compose exec -T api pnpm --filter @suite/db prisma migrate deploy
            docker image prune -f
