# Deployment stack for Business OS: the API, the tenant workspace, the public
# storefront, the operator console and the edge proxy that fronts them.
#
# Copy the root .env.example to ../../.env, fill the app values, then copy
# .env.example to .env here and fill the proxy values.
#
# Every application service pulls the image the deploy workflow publishes and
# also carries the build definition that produced it, so a first run on a new
# host can build locally instead. Both paths use the same Dockerfile.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: businessos_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: business_os_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U businessos_admin -d business_os_dev"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/business-os-systems/business-os/business-os-api:latest
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
      - .env
    environment:
      NODE_ENV: production
      PORT: "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "4000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health/live').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  dashboard:
    image: ghcr.io/business-os-systems/business-os/business-os-dashboard:latest
    build:
      context: ../..
      dockerfile: apps/dashboard/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/login').then((res) => process.exit(res.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    image: ghcr.io/business-os-systems/business-os/business-os-web:latest
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
      - .env
    environment:
      NODE_ENV: production
      PORT: "3003"
      HOSTNAME: "0.0.0.0"
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3003"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3003/').then((res) => process.exit(res.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  platform:
    image: ghcr.io/business-os-systems/business-os/business-os-platform:latest
    build:
      context: ../..
      dockerfile: deploy/platform/Dockerfile
      target: platform
      args:
        # The operator console calls the API on its own origin; a missing
        # OPERATOR_HOST must break the deploy here instead of baking "https://"
        # into the console build.
        NEXT_PUBLIC_API_URL: https://${OPERATOR_HOST:?OPERATOR_HOST must hold the operator console hostname}
    restart: unless-stopped
    env_file:
      - ../../.env
      - .env
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3002"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3002/').then((res) => process.exit(res.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./break-glass-ca.pem:/etc/caddy/break-glass-ca.pem:ro
      # The wildcard tenant certificate (*.<DOMAIN_ROOT>) is issued with DNS-01
      # outside Caddy and mounted read-only; the stock image has no DNS provider
      # module. TENANT_TLS_DIR must name the host directory that holds
      # fullchain.pem and privkey.pem, and an unset value fails the deploy
      # instead of silently mounting an empty path.
      - ${TENANT_TLS_DIR:?TENANT_TLS_DIR must hold the directory with fullchain.pem and privkey.pem}:/etc/caddy/tenant-tls:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_healthy
      platform:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
