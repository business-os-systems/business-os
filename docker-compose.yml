services:
  postgres:
    image: postgres:16-alpine
    container_name: business_os_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: businessos_admin
      POSTGRES_PASSWORD: businessos_password
      POSTGRES_DB: business_os_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U businessos_admin -d business_os_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: business_os_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
